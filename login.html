<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>slice Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f5f5;
    font-family:'Segoe UI',sans-serif;
}

.login-container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    background:white;
    width:100%;
    max-width:420px;
    padding:40px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.logo{
    font-size:2.5rem;
    font-weight:800;
    text-align:center;
    margin-bottom:20px;
}

#otpSection{
    display:none;
}

.demo-otp{
    background:#f8f9fa;
    padding:10px;
    border-radius:10px;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

</style>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>
<body>

<div class="login-container">

<div class="login-card">

<div class="logo">
slice
</div>

<h4 class="text-center mb-4">
Login to your account
</h4>

<div id="mobileSection">

<label class="form-label">
Mobile Number
</label>

<input
type="text"
id="mobile"
class="form-control mb-3"
placeholder="Enter mobile number">

<button id="sendOtp"
class="btn btn-dark w-100">
Send OTP
</button>

</div>

<div id="otpSection">

<label class="form-label mt-3">
Enter OTP
</label>

<input
type="text"
id="otpInput"
class="form-control mb-3"
placeholder="Enter OTP">

<div class="demo-otp">
Demo OTP: <span id="otpDisplay"></span>
</div>

<button
id="verifyOtp"
class="btn btn-success w-100 mt-3">
Verify OTP
</button>

</div>

<div id="message" class="mt-3 text-center"></div>

</div>

</div>

<script>

let generatedOTP = "";

$("#sendOtp").click(function(){

    let mobile = $("#mobile").val();

    if(mobile.length !== 10){

        $("#message").html(
            "<span class='text-danger'>Enter valid 10-digit mobile number</span>"
        );

        return;
    }

    generatedOTP =
        Math.floor(
            1000 + Math.random()*9000
        );

    $("#otpDisplay").text(generatedOTP);

    $("#otpSection").slideDown();

    $("#message").html(
        "<span class='text-success'>OTP Sent Successfully</span>"
    );
});

$("#verifyOtp").click(function(){

    let enteredOTP = $("#otpInput").val();

    if(enteredOTP == generatedOTP){

        localStorage.setItem("loggedIn","true");

        localStorage.setItem(
            "mobile",
            $("#mobile").val()
        );

        $("#message").html(
            "<span class='text-success'>Login Successful</span>"
        );

        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        },1000);

    }

    else{

        $("#message").html(
            "<span class='text-danger'>Incorrect OTP</span>"
        );

    }

});

</script>

</body>
</html>
