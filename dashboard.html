<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>slice Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>

body{
    background:#f4f5f7;
    font-family:'Segoe UI',sans-serif;
}

.navbar-brand{
    font-weight:800;
    font-size:2rem;
}

.slice-card{
    background:linear-gradient(135deg,#111,#444);
    color:white;
    border-radius:25px;
    padding:30px;
    min-height:220px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.info-card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    height:100%;
}

.transaction{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.reward-circle{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.4rem;
    font-weight:bold;
    margin:auto;
}

.dark-mode{
    background:#111 !important;
    color:white !important;
}

.dark-mode .info-card,
.dark-mode .transaction{
    background:#1f1f1f;
    color:white;
}

.dark-mode .navbar{
    background:#000 !important;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="#">
slice
</a>

<div class="ms-auto">

<button
class="btn btn-warning me-2"
id="darkModeBtn">
Dark Mode
</button>

<button
class="btn btn-danger"
id="logoutBtn">
Logout
</button>

</div>

</div>
</nav>

<div class="container py-5">

<div class="row g-4">

<div class="col-lg-6">

<div class="slice-card">

<h3>slice card</h3>

<p class="mt-4">
**** **** **** 5678
</p>

<h2 class="mt-4">
₹1,25,000
</h2>

<p>Available Balance</p>

</div>

</div>

<div class="col-lg-3">

<div class="info-card text-center">

<h5>Credit Limit</h5>

<h2>₹2,00,000</h2>

</div>

</div>

<div class="col-lg-3">

<div class="info-card text-center">

<h5>Rewards</h5>

<h2 id="rewardCounter">
0
</h2>

</div>

</div>

</div>

<div class="row mt-4 g-4">

<div class="col-lg-6">

<div class="info-card">

<h4 class="mb-4">
Recent Transactions
</h4>

<div class="transaction">
<span>Zomato</span>
<span>- ₹450</span>
</div>

<div class="transaction">
<span>Uber</span>
<span>- ₹220</span>
</div>

<div class="transaction">
<span>Amazon</span>
<span>- ₹1,999</span>
</div>

<div class="transaction">
<span>Swiggy</span>
<span>- ₹350</span>
</div>

<div class="transaction">
<span>Recharge</span>
<span>- ₹299</span>
</div>

</div>

</div>

<div class="col-lg-6">

<div class="info-card">

<h4 class="text-center mb-4">
Reward Points
</h4>

<div class="reward-circle">
2500
</div>

<div class="progress mt-4">

<div
class="progress-bar progress-bar-striped progress-bar-animated"
style="width:70%">
70%
</div>

</div>

<p class="text-center mt-3">
700 points away from next reward
</p>

</div>

</div>

</div>

<div class="row mt-4">

<div class="col-12">

<div class="info-card">

<h4 class="mb-4">
Monthly Spending Analytics
</h4>

<div class="mb-3">

<label>Food</label>

<div class="progress">
<div class="progress-bar bg-success"
style="width:75%">
75%
</div>
</div>

</div>

<div class="mb-3">

<label>Travel</label>

<div class="progress">
<div class="progress-bar bg-primary"
style="width:55%">
55%
</div>
</div>

</div>

<div class="mb-3">

<label>Shopping</label>

<div class="progress">
<div class="progress-bar bg-danger"
style="width:90%">
90%
</div>
</div>

</div>

</div>

</div>

</div>

</div>

<script>

// Login Protection

if(localStorage.getItem("loggedIn") !== "true"){

    window.location.href = "login.html";

}

// Reward Counter Animation

let count = 0;

let interval = setInterval(function(){

    count += 50;

    $("#rewardCounter").text(count);

    if(count >= 2500){

        clearInterval(interval);

    }

},20);

// Dark Mode

$("#darkModeBtn").click(function(){

    $("body").toggleClass("dark-mode");

});

// Logout

$("#logoutBtn").click(function(){

    localStorage.removeItem("loggedIn");

    window.location.href = "login.html";

});

</script>

</body>
</html>
